<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
    <meta name="apple-mobile-web-app-title" content="RIFTBALL" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      #rotate { display: none; position: fixed; inset: 0; z-index: 99999; background: #12082b; color: #fff;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font: 700 20px/1.3 system-ui, sans-serif; text-align: center; padding: 24px; }
      #rotate .ph { width: 54px; height: 90px; border: 5px solid #fff; border-radius: 12px; animation: rot 1.8s ease-in-out infinite; }
      @keyframes rot { 0%, 30% { transform: rotate(0) } 60%, 100% { transform: rotate(-90deg) } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
    <title>RIFTBALL</title>
    <link rel="icon" href="./favicon.png" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="rotate"><div class="ph"></div>Tourne ton téléphone<br />pour jouer à RIFTBALL</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
