<!doctype html><html><head><style>
@font-face { font-family: L; src: url('../node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2'); }
html,body{margin:0;width:1024px;height:1024px;background:transparent}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#a07bff,#5a2fe0 45%,#24106b 100%);overflow:hidden}
.bg:before{content:'';position:absolute;inset:-30%;background:conic-gradient(rgba(255,255,255,.09) 0 12deg,transparent 12deg 30deg)}
.orb{position:absolute;left:212px;top:150px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#d6b8ff 18%,#8b3dff 52%,#3c096c 100%);border:34px solid #1a1030;box-shadow:0 0 120px #c9a5ff;box-sizing:border-box}
.eye{position:absolute;top:190px;width:120px;height:190px;background:#fff;border-radius:50%;border:22px solid #1a1030;box-sizing:border-box}
.eye i{position:absolute;left:30px;top:52px;width:52px;height:80px;background:#1a1030;border-radius:50%}
.eye i:after{content:'';position:absolute;left:10px;top:10px;width:18px;height:18px;background:#fff;border-radius:50%}
.ring{position:absolute;left:92px;top:390px;width:840px;height:220px;border-radius:50%;border:30px solid #ffcd1f;transform:rotate(-14deg);box-shadow:0 0 0 14px #1a1030, inset 0 0 0 14px #1a1030}
.t{position:absolute;bottom:40px;width:100%;text-align:center;font:200px L;color:#ffcd1f;-webkit-text-stroke:26px #1a1030;paint-order:stroke fill;letter-spacing:4px}
</style></head><body><div class="bg"><div class="ring"></div><div class="orb"><div class="eye" style="left:150px"><i></i></div><div class="eye" style="left:300px"><i></i></div></div><div class="t">RIFT</div></div></body></html>
